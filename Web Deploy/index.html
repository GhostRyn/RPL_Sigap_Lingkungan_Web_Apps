<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SIGAP Lingkungan</title><meta name="color-scheme" content="light dark">
<style>
:root{--d:#41431B;--s:#AEB784;--e:#E3DBBB;--c:#F8F3E1;--card:#FFFDF4;--t:#41431B;--m:#6B6D45;--btn:#41431B;--btnt:#F8F3E1;--bd:#E3DBBB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--c:#26270E;--card:#33351A;--t:#F8F3E1;--m:#AEB784;--btn:#AEB784;--btnt:#26270E;--bd:#4D4F28;--e:#4D4F28}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--c);color:var(--t);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--e);color:var(--t);border-right:1px solid var(--bd);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font:700 20px Georgia,serif;padding:0 10px 18px;display:flex;gap:10px;align-items:center}.logo i{width:32px;height:32px;border-radius:10px;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-style:normal}
aside button.n{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;color:var(--t)}aside button.n:hover{background:var(--c)}aside button.n.on{background:var(--s);color:#41431B;font-weight:600}
.me{margin-top:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:13px}.me b{display:block}
main{padding:32px 40px;max-width:1180px;width:100%}main>p.sub{color:var(--m);margin:4px 0 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;box-shadow:0 1px 3px #41431b14}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.gd{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--s);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--s);outline-offset:1px}textarea{min-height:100px;resize:vertical}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;cursor:pointer}.btn:hover{opacity:.9}
.btn.alt{background:var(--s);color:#41431B}.btn.sm{padding:6px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--m);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid var(--bd)}
tr.r{cursor:pointer}tr.r:hover td,tr.sel td{background:var(--e)}
.b{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid #AEB784}
.b.Baru{background:#E3DBBB;color:#41431B}.b.Diproses{background:#AEB784;color:#41431B}.b.Selesai{background:#41431B;color:#F8F3E1}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
.stat{font:700 34px Georgia,serif}.m{color:var(--m);font-size:13px}
.step{display:flex;gap:8px;margin:18px 0}.step div{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--e);color:var(--m);font-weight:600}.step div.on{background:var(--s);color:#41431B}
.tiket{background:var(--s);color:#41431B;border-radius:14px;padding:22px;text-align:center;margin-top:20px}.tiket b{display:block;font:700 26px Georgia,serif;letter-spacing:1px;color:#41431B;margin:6px 0}
.ph{height:120px;border-radius:12px;background:var(--e);display:grid;place-items:center;color:var(--m);overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0}.bar span:first-child{width:110px;font-size:13px}.bar i{display:block;height:14px;border-radius:7px;background:var(--s);min-width:4px}
pre{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px}
.wrap{overflow-x:auto}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.lp .logo i{background:#41431B;color:#F8F3E1}.lp{background:linear-gradient(160deg,#AEB784,#E3DBBB);color:#41431B;padding:64px;display:flex;flex-direction:column;justify-content:center;gap:18px}.lp h1{font-size:44px;line-height:1.15}.lp p{color:#41431B;margin:0}.lp li{margin:8px 0;color:#41431B}
.rp{display:grid;place-items:center;padding:40px}.rp .card{width:100%;max-width:400px}
.tabs{display:flex;gap:6px;background:var(--e);padding:4px;border-radius:12px}.tabs button{all:unset;flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}.tabs button.on{background:var(--btn);color:var(--btnt)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#41431B;color:#F8F3E1;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 6px 20px #0003;z-index:9}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:#8a3b1f}
@media(max-width:860px){.app,.login,.g2,.g3,.gd{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:20px}.lp{padding:32px}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#41431B"><link rel="icon" href="icon.svg"></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),AR=['RT 01/RW 05','RT 02/RW 05','RT 03/RW 05'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=[[41,'Budi Santoso','0812-xxxx-0141',0,'Tumpukan sampah liar di pojok lapangan','Baru','2026-11-04 07:30'],[42,'Siti Rahma','0812-xxxx-0101',2,'Saluran air tersumbat sampah plastik','Diproses','2026-11-03 08:15'],[43,'Agus Wijaya','0857-xxxx-0243',1,'Selokan berlumut dan berbau menyengat','Selesai','2026-11-01 16:40'],[44,'Dewi Lestari','0813-xxxx-0377',0,'Kantong sampah menumpuk di depan pos ronda','Baru','2026-11-05 06:50'],[45,'Siti Rahma','0812-xxxx-0101',2,'Bak sampah RT penuh dan meluber ke jalan','Baru','2026-11-05 09:10'],[46,'Hendra Putra','0821-xxxx-0460',1,'Got depan musala tersumbat','Diproses','2026-11-02 12:05']].map(a=>({id:a[0],own:a[1],hp:a[2],ar:a[3],d:a[4],st:a[5],t:a[6],lat:'-6.2'+a[0],lng:'106.8'+a[0],img:'',h:[['Baru',a[6]]].concat(a[5]!='Baru'?[['Diproses',a[6]]]:[]).concat(a[5]=='Selesai'?[['Selesai',a[6]]]:[])}));
const S={u:null,role:'warga',p:'',sel:null,f:{st:'',ar:'',dt:''},made:0,tiket:null,rekap:'',log:[],ident:null,N:[{own:'Siti Rahma',m:'Laporan Anda (SGP-20261103-0042) sedang diproses.',t:'2026-11-03 10:00'}],acc:[['Ketua RT 01',1],['Ketua RT 02',1],['Ketua RT 03',1]]};
const nav={warga:[['buat','Buat Laporan'],['lacak','Lacak Status'],['notif','Notifikasi']],pengurus:[['daftar','Daftar Laporan'],['rekap','Rekap Laporan']],admin:[['pelapor','Data Pelapor Asli'],['audit','Audit Log'],['akun','Akun Pengurus']]};
const tk=r=>`SGP-${r.t.slice(0,10).replace(/-/g,'')}-${String(r.id).padStart(4,'0')}`,bd=s=>`<span class="b ${s}">${s}</span>`,now=()=>new Date(Date.now()+25200000).toISOString().slice(0,16).replace('T',' ');
function msg(t,k){const e=$('#toast');e.textContent=t;e.className='show '+(k||'');clearTimeout(msg.i);msg.i=setTimeout(()=>e.className='',3400)}
function go(p){S.p=p;S.tiket=null;S.ident=null;draw()}
function setRole(r){S.role=r;draw()}
function masuk(){const names={warga:'Siti Rahma',pengurus:'Ketua RT 03',admin:'Admin Sistem'};S.u={name:names[S.role],role:S.role};S.p=nav[S.role][0][0];S.sel=null;draw()}
function keluar(){S.u=null;draw()}
const titles={buat:['Buat Laporan','Laporkan masalah lingkungan. Identitas Anda tidak akan terlihat oleh pengurus.'],lacak:['Lacak Status Laporan','Masukkan kode tiket untuk melihat perkembangan laporan Anda.'],notif:['Notifikasi','Pemberitahuan setiap kali status laporan Anda berubah.'],daftar:['Daftar Laporan','Laporan warga tampil anonim sebagai “Warga #nn”.'],rekap:['Rekap Laporan','Ringkasan laporan per status dan area untuk evaluasi rapat RT.'],pelapor:['Data Pelapor Asli','Akses khusus penanganan penyalahgunaan. Setiap akses dicatat.'],audit:['Audit Log','Riwayat akses admin terhadap data pelapor asli.'],akun:['Akun Pengurus','Kelola akun pengurus RT/RW.']};
function draw(){const a=$('#app');if(!S.u&&(S.auth=='daftar'||S.auth=='otp')){a.innerHTML=authScr();return}if(!S.u){a.innerHTML=`<div class="login"><div class="lp"><div class="logo" style="padding:0"><i>S</i>SIGAP Lingkungan</div><h1>Lapor aman,<br>lingkungan nyaman.</h1><p>Sistem pelaporan kebersihan RT/RW dengan pelapor anonim.</p><ul><li>Identitas pelapor disamarkan dari pengurus</li><li>Kode tiket untuk melacak tindak lanjut</li><li>Rekap terpusat untuk evaluasi lingkungan</li></ul></div><div class="rp"><div class="card"><h2>Masuk</h2><p class="m">Pilih peran Anda untuk melanjutkan.</p><div class="tabs">${['warga','pengurus','admin'].map(r=>`<button class="${S.role==r?'on':''}" onclick="setRole('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div><label>Nomor HP</label><input id="hpl" placeholder="08xx xxxx xxxx" autocomplete="username"><label>Kata sandi</label><input id="pwl" type="password" autocomplete="current-password"><br><br><button class="btn" style="width:100%" onclick="masuk()">Masuk</button><p class="m" style="text-align:center">Belum punya akun? <button class="btn alt sm" onclick="S.auth='daftar';draw()">Daftar</button></p><p class="m" style="text-align:center">Lupa kata sandi? Hubungi admin RT/RW.</p></div></div></div>`;return}
const r=S.u.role,t=titles[S.p];a.innerHTML=`<div class="app"><aside><div class="logo"><i>S</i>SIGAP</div>${nav[r].map(n=>`<button class="n ${S.p==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<div class="me"><b>${esc(S.u.name)}</b><span style="color:var(--m)">${r=='warga'?'Warga (Pelapor)':r=='pengurus'?'Pengurus RT/RW':'Admin Sistem'}</span><br><button class="btn alt sm" style="margin-top:10px" onclick="keluar()">Keluar</button></div></aside><main><h1>${t[0]}</h1><p class="sub">${t[1]}</p>${V[S.p]()}</main></div>`}
const opt=(a,v)=>a.map((x,i)=>`<option value="${i}" ${v==i?'selected':''}>${x}</option>`).join('');
const V={
buat:()=>`<div class="gd"><div class="card"><label>Deskripsi masalah</label><textarea id="desc" placeholder="Contoh: saluran air di depan rumah tersumbat sampah"></textarea><label>Foto bukti (maks. 5 MB)</label><input type="file" id="foto" accept="image/*" onchange="prev(this)"><div class="ph" style="margin-top:8px" id="pv">Pratinjau foto</div><label>Area</label><select id="ar">${opt(AR,2)}</select><div class="row"><div><label>Lintang</label><input id="lat" placeholder="-6.2000"></div><div><label>Bujur</label><input id="lng" placeholder="106.8000"></div><button class="btn alt" onclick="gps()">Ambil GPS</button></div><p class="m">Jika GPS tidak aktif, isi koordinat secara manual.</p><button class="btn" onclick="kirim()">Kirim Laporan</button></div><div>${S.tiket?`<div class="tiket"><span>Laporan terkirim. Kode tiket Anda:</span><b>${S.tiket}</b><span style="color:#41431B">Simpan kode ini untuk melacak status.</span></div>`:''}<div class="card" style="margin-top:${S.tiket?20:0}px"><h3>Tips melapor</h3><p class="m">Foto jelas, deskripsi singkat, dan lokasi akurat mempercepat penanganan. Batas pembuatan laporan: 3 per hari.</p></div></div></div>`,
lacak:()=>`<div class="card" style="max-width:640px"><div class="row"><div><label>Kode tiket</label><input id="kode" placeholder="SGP-20261103-0042" value="${S.q||''}"></div><button class="btn" onclick="cari()">Cari</button></div>${S.hasil===undefined?'<p class="m">Contoh kode: SGP-20261103-0042</p>':S.hasil?`<h3 style="margin-top:20px">${esc(S.hasil.d)}</h3><div class="step">${['Baru','Diproses','Selesai'].map((s,i)=>`<div class="${i<=['Baru','Diproses','Selesai'].indexOf(S.hasil.st)?'on':''}">${s}</div>`).join('')}</div>${S.hasil.h.map(h=>`<p class="m">${h[1]} · ${bd(h[0])}</p>`).join('')}`:'<p style="color:#b4502a">Laporan tidak ditemukan atau bukan milik akun Anda.</p>'}</div>`,
notif:()=>{const n=S.N.filter(x=>x.own==S.u.name);return`<div class="card" style="max-width:640px">${n.length?n.map(x=>`<p><b>${x.m}</b><br><span class="m">${x.t} · SMS</span></p>`).join('<hr style="border:0;border-top:1px solid var(--bd)">'):'<p class="m">Belum ada notifikasi.</p>'}</div>`},
daftar:()=>{const f=S.f,L=R.filter(r=>(!f.st||r.st==f.st)&&(f.ar===''||r.ar==f.ar)&&(!f.dt||r.t.startsWith(f.dt))),s=S.sel&&R.find(r=>r.id==S.sel);return`<div class="card" style="margin-bottom:20px"><div class="row"><div><label>Status</label><select onchange="S.f.st=this.value;draw()"><option value="">Semua</option>${['Baru','Diproses','Selesai'].map(x=>`<option ${f.st==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Area</label><select onchange="S.f.ar=this.value;draw()"><option value="">Semua</option>${opt(AR,f.ar)}</select></div><div><label>Tanggal</label><input type="date" value="${f.dt}" onchange="S.f.dt=this.value;draw()"></div></div></div><div class="gd"><div class="card wrap"><table><tr><th>Pelapor</th><th>Masalah</th><th>Area</th><th>Status</th></tr>${L.map(r=>`<tr class="r ${S.sel==r.id?'sel':''}" onclick="S.sel=${r.id};draw()"><td><b>Warga #${r.id}</b></td><td>${esc(r.d)}</td><td>${AR[r.ar]}</td><td>${bd(r.st)}</td></tr>`).join('')||'<tr><td colspan=4 class="m">Tidak ada laporan.</td></tr>'}</table></div><div class="card">${s?`<h3>Warga #${s.id}</h3><p>${esc(s.d)}</p><div class="ph">${s.img?`<img src="${s.img}" alt="Foto laporan">`:'Foto laporan'}</div><svg viewBox="0 0 300 110" style="width:100%;margin-top:12px;border-radius:12px;background:var(--e)"><path d="M0 70H300M0 35H300M75 0V110M150 0V110M225 0V110" stroke="#AEB784" stroke-width="1.5"/><circle cx="165" cy="48" r="9" fill="#41431B"/><circle cx="165" cy="48" r="3.5" fill="#F8F3E1"/></svg><p class="m">${AR[s.ar]} · ${s.lat}, ${s.lng}<br>Status: ${bd(s.st)}</p><div class="row"><button class="btn alt sm" onclick="ubah('Diproses')">Tandai Diproses</button><button class="btn sm" onclick="ubah('Selesai')">Tandai Selesai</button></div>`:'<p class="m">Pilih laporan untuk melihat detail, foto, dan lokasi.</p>'}</div></div>`},
rekap:()=>{const c=s=>R.filter(r=>r.st==s).length,mx=Math.max(...AR.map((_,i)=>R.filter(r=>r.ar==i).length));return`<div class="g3">${['Baru','Diproses','Selesai'].map(s=>`<div class="card"><div class="m">${s}</div><div class="stat">${c(s)}</div></div>`).join('')}</div><div class="g2" style="margin-top:20px"><div class="card"><h3>Laporan per area</h3>${AR.map((a,i)=>{const n=R.filter(r=>r.ar==i).length;return`<div class="bar"><span>${a}</span><i style="width:${n/mx*60}%"></i><b>${n}</b></div>`}).join('')}</div><div class="card"><h3>Ekspor rekap</h3><p class="m">Tampilkan rekap dalam format CSV untuk disalin ke Excel.</p><button class="btn" onclick="eks()">Ekspor CSV</button>${S.rekap?`<pre>${esc(S.rekap)}</pre>`:''}</div></div>`},
pelapor:()=>`<div class="g2"><div class="card"><label>Laporan yang diperiksa</label><select id="lp">${R.map(r=>`<option value="${r.id}">Warga #${r.id} – ${esc(r.d)}</option>`).join('')}</select><label>Alasan akses (wajib)</label><input id="alasan" placeholder="Contoh: dugaan laporan palsu berulang"><br><br><button class="btn" onclick="akses()">Tampilkan Data Pelapor</button></div><div class="card">${S.ident?`<h3>${esc(S.ident.own)}</h3><p>Nomor HP: ${S.ident.hp}<br>Area domisili: ${AR[S.ident.ar]}</p><button class="btn alt sm" onclick="msg('Akun pelapor diblokir (simulasi).')">Blokir akun</button>`:'<p class="m">Data pelapor ditampilkan setelah alasan diisi dan akses dicatat pada audit log.</p>'}</div></div>`,
audit:()=>`<div class="card wrap"><table><tr><th>Waktu</th><th>Admin</th><th>Laporan</th><th>Alasan</th></tr>${S.log.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>Warga #${l[2]}</td><td>${esc(l[3])}</td></tr>`).join('')||'<tr><td colspan=4 class="m">Belum ada akses tercatat.</td></tr>'}</table></div>`,
akun:()=>`<div class="card wrap"><table><tr><th>Nama</th><th>Status</th><th></th></tr>${S.acc.map((a,i)=>`<tr><td>${a[0]}</td><td>${a[1]?'Aktif':'Nonaktif'}</td><td><button class="btn alt sm" onclick="S.acc[${i}][1]^=1;draw()">${a[1]?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</table></div>`};
const LP=`<div class="lp"><div class="logo" style="padding:0"><i>S</i>SIGAP Lingkungan</div><h1>Lapor aman,<br>lingkungan nyaman.</h1><p>Sistem pelaporan kebersihan RT/RW dengan pelapor anonim.</p><ul><li>Identitas pelapor disamarkan dari pengurus</li><li>Kode tiket untuk melacak tindak lanjut</li><li>Rekap terpusat untuk evaluasi lingkungan</li></ul></div>`;
function authScr(){const o=S.auth=='otp';return `<div class="login">${LP}<div class="rp"><div class="card"><h2>${o?'Verifikasi OTP':'Daftar Akun'}</h2><p class="m">${o?'Masukkan kode 6 digit yang dikirim ke nomor HP Anda (mode demo: kode tampil di layar).':'Data identitas disimpan terenkripsi dan tidak ditampilkan kepada pengurus.'}</p>${o?`<label>Kode OTP</label><input id="otp" maxlength="6" placeholder="123456"><br><br><button class="btn" style="width:100%" onclick="verif()">Verifikasi</button>`:`<label>Nama lengkap</label><input id="nm"><label>Nomor HP</label><input id="hp" placeholder="08xx xxxx xxxx"><label>Kata sandi</label><input id="pw" type="password"><label>RT/RW domisili</label><select id="ra">${opt(AR,2)}</select><br><br><button class="btn" style="width:100%" onclick="kirimOtp()">Kirim OTP</button>`}<p class="m" style="text-align:center"><button class="btn alt sm" onclick="S.auth='login';draw()">Kembali ke halaman masuk</button></p></div></div></div>`}
function kirimOtp(){if(!$('#nm').value.trim()||$('#hp').value.replace(/\D/g,'').length<9||$('#pw').value.length<6)return msg('Lengkapi nama, nomor HP valid, dan kata sandi minimal 6 karakter.','err');S.auth='otp';draw();msg('Kode OTP dikirim via SMS.')}
function verif(){if($('#otp').value.trim()!='123456')return msg('Kode OTP salah. Coba lagi.','err');S.auth='login';S.role='warga';draw();msg('Akun aktif. Silakan masuk.')}
let imgURL='';
function prev(i){const f=i.files[0];imgURL=f&&f.type.startsWith('image/')?URL.createObjectURL(f):'';$('#pv').innerHTML=imgURL?`<img src="${imgURL}" alt="Pratinjau">`:'Berkas bukan gambar'}
function gps(){if(!navigator.geolocation)return msg('GPS tidak tersedia. Isi koordinat manual.','err');navigator.geolocation.getCurrentPosition(p=>{$('#lat').value=p.coords.latitude.toFixed(5);$('#lng').value=p.coords.longitude.toFixed(5);msg('Lokasi berhasil diambil.')},()=>msg('GPS tidak aktif. Isi koordinat secara manual.','err'))}
function kirim(){const d=$('#desc').value.trim(),f=$('#foto').files[0],lat=$('#lat').value.trim(),lng=$('#lng').value.trim();
if(S.made>=3)return msg('Batas laporan tercapai (maks. 3 per hari).','err');
if(d.length<10)return msg('Deskripsi minimal 10 karakter.','err');
if(!f)return msg('Lampirkan minimal satu foto.','err');
if(!f.type.startsWith('image/')||f.size>5242880)return msg('Foto tidak valid: harus gambar maksimal 5 MB.','err');
if(!lat||!lng)return msg('Lokasi belum diisi. Gunakan GPS atau input manual.','err');
const t=now(),r={id:47+S.made,own:S.u.name,hp:'0812-xxxx-0101',ar:+$('#ar').value,d,st:'Baru',t,lat,lng,img:imgURL,h:[['Baru',t]]};R.push(r);S.made++;S.tiket=tk(r);draw();msg('Laporan berhasil dikirim.')}
function cari(){const v=$('#kode').value.trim().toUpperCase();S.q=v;S.hasil=R.find(r=>tk(r)==v&&r.own==S.u.name)||null;draw()}
function ubah(n){const r=R.find(x=>x.id==S.sel),o=['Baru','Diproses','Selesai'];if(o.indexOf(n)!=o.indexOf(r.st)+1)return msg(`Transisi tidak valid: ${r.st} → ${n}.`,'err');r.st=n;r.h.push([n,now()]);S.N.push({own:r.own,m:`Laporan Anda (${tk(r)}) kini berstatus ${n}.`,t:now()});draw();msg(`Status diubah ke ${n}. Notifikasi dikirim ke pelapor.`)}
function eks(){S.rekap='area,baru,diproses,selesai\n'+AR.map((a,i)=>[a,...['Baru','Diproses','Selesai'].map(s=>R.filter(r=>r.ar==i&&r.st==s).length)].join(',')).join('\n');draw()}
function akses(){const a=$('#alasan').value.trim();if(!a)return msg('Akses ditolak: alasan wajib diisi.','err');const r=R.find(x=>x.id==$('#lp').value);S.log.unshift([now(),S.u.name,r.id,a]);S.ident=r;draw();msg('Akses dicatat pada audit log.')}
draw();
</script><script>
const api=async(a,o={})=>{try{const r=await fetch('api.php?a='+a,o.fd?{method:'POST',body:o.fd}:o.d?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o.d)}:{});return await r.json()}catch(e){return{ok:0,err:'Koneksi gagal. Coba lagi.'}}};
async function load(){const j=await api('data');if(!j.ok)return;R.length=0;R.push(...j.R);S.N=j.N;S.log=j.log;S.acc=j.acc}
async function boot(){const j=await api('me');if(j.ok&&j.u){S.u=j.u;S.role=j.u.role;S.p=nav[j.u.role][0][0];await load()}draw()}
async function masuk(){const j=await api('login',{d:{hp:$('#hpl').value,pw:$('#pwl').value,role:S.role}});if(!j.ok)return msg(j.err,'err');S.u=j.u;S.p=nav[S.role][0][0];S.sel=null;await load();draw()}
async function keluar(){await api('logout');S.u=null;R.length=0;draw()}
async function kirimOtp(){const hp=$('#hp').value,j=await api('daftar',{d:{nama:$('#nm').value,hp,pw:$('#pw').value,area:$('#ra').value}});if(!j.ok)return msg(j.err,'err');S.hpd=hp;S.auth='otp';draw();msg(j.otp?'Kode OTP (mode demo): '+j.otp:'Kode OTP dikirim via SMS.')}
async function verif(){const j=await api('verif',{d:{hp:S.hpd,kode:$('#otp').value.trim()}});if(!j.ok)return msg(j.err,'err');S.auth='login';S.role='warga';draw();msg('Akun aktif. Silakan masuk.')}
async function cari(){const v=$('#kode').value.trim().toUpperCase();S.q=v;const j=await api('cari',{d:{kode:v}});S.hasil=j.ok?j.r:null;draw()}
async function kirim(){const d=$('#desc').value.trim(),f=$('#foto').files[0],lat=$('#lat').value.trim(),lng=$('#lng').value.trim();
if(d.length<10)return msg('Deskripsi minimal 10 karakter.','err');if(!f)return msg('Lampirkan minimal satu foto.','err');
if(!f.type.startsWith('image/')||f.size>5242880)return msg('Foto tidak valid: harus gambar maksimal 5 MB.','err');if(!lat||!lng)return msg('Lokasi belum diisi. Gunakan GPS atau input manual.','err');
const fd=new FormData();fd.append('d',d);fd.append('foto',f);fd.append('lat',lat);fd.append('lng',lng);fd.append('ar',$('#ar').value);
const j=await api('kirim',{fd});if(!j.ok)return msg(j.err,'err');S.tiket=j.tiket;await load();draw();msg('Laporan berhasil dikirim.')}
async function ubah(n){const j=await api('ubah',{d:{id:S.sel,st:n}});if(!j.ok)return msg(j.err,'err');await load();draw();msg(`Status diubah ke ${n}. Notifikasi dikirim ke pelapor.`)}
async function akses(){const al=$('#alasan').value.trim();if(!al)return msg('Akses ditolak: alasan wajib diisi.','err');const j=await api('akses',{d:{id:$('#lp').value,alasan:al}});if(!j.ok)return msg(j.err,'err');S.ident=j;await load();draw();msg('Akses dicatat pada audit log.')}
async function togAkun(id){await api('akun',{d:{id}});await load();draw()}
function eks(){location.href='api.php?a=csv'}
V.akun=()=>`<div class="card wrap"><table><tr><th>Nama</th><th>Status</th><th></th></tr>${S.acc.map(a=>`<tr><td>${esc(a[0])}</td><td>${a[1]?'Aktif':'Nonaktif'}</td><td><button class="btn alt sm" onclick="togAkun(${a[2]})">${a[1]?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</table></div>`;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
